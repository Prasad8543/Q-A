<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Answers</title>
  <!-- Link to Font Awesome CDN -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <style>
    body {
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f4f6f8;
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 800px;
      margin: auto;
      background: #fff;
      padding: 25px 30px;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }

    h2, h3 {
      color: #333;
      margin-bottom: 20px;
    }

    .answer {
      border-bottom: 1px solid #eee;
      padding: 15px 0;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      flex-direction: row;
    }

    .answer p {
      margin: 0;
      color: #444;
      flex-grow: 1;
      text-align: left;
    }

    .like-box {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
      align-items: center;
    }

    .like-box button {
      background-color: #e9ecef;
      border: 1px solid #ccc;
      padding: 6px 10px;
      font-size: 14px;
      border-radius: 5px;
      cursor: pointer;
    }

    .like-box button:hover {
      background-color: #d4d9df;
    }

    .like-box .like i, .like-box .dislike i {
      color: #007bff;
    }

    textarea {
      width: 100%;
      height: 70px;
      margin-top: 10px;
      padding: 10px;
      border-radius: 6px;
      border: 1px solid #ccc;
      resize: none;
      font-size: 14px;
    }

    /* Align the Post Answer button */
    .post-btn-container {
      display: flex;
      justify-content: flex-end;
      margin-top: 15px;
    }

    button.post {
      background-color: #007bff;
      color: white;
      padding: 10px 20px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    button.post:hover {
      background-color: #0069d9;
    }

    .pagination {
      display: flex;
      justify-content: space-between;
      margin-top: 20px;
    }

    .pagination button {
      background: #f1f1f1;
      color: #333;
      padding: 6px 10px;
      border: 1px solid #ccc;
      border-radius: 4px;
      cursor: pointer;
    }

    .pagination button:disabled {
      cursor: not-allowed;
      opacity: 0.5;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2 id="questionHeader">Question</h2>
    <div id="answersList"></div>

    <!-- Pagination Buttons Below the Answers -->
    <div class="pagination">
      <button id="prevBtn" onclick="loadAnswers(prevUrl)" disabled>&laquo; Prev</button>
      <button id="nextBtn" onclick="loadAnswers(nextUrl)" disabled>Next &raquo;</button>
    </div>

    <hr>
    <h3>Your Answer</h3>
    <textarea id="answerText" placeholder="Write your answer..."></textarea>
    
    <!-- Post Button inside a Flex Container -->
    <div class="post-btn-container">
      <button class="post" onclick="postAnswer()">Post Answer</button>
    </div>
  </div>

  <script>
    const apiBase = "http://127.0.0.1:8000/api/v1";
    const urlParams = new URLSearchParams(window.location.search);
    const questionId = urlParams.get("questionId");

    let nextUrl = null;
    let prevUrl = null;

    function getAuthHeaders() {
      const token = localStorage.getItem("access_token");
      return {
        "Content-Type": "application/json",
        ...(token && { Authorization: `JWT ${token}` })
      };
    }

    async function loadAnswers(url = `${apiBase}/question/${questionId}/answers/`) {
      const res = await fetch(url, {
        headers: getAuthHeaders()
      });
      const data = await res.json();

      // Pagination
      nextUrl = res.headers.get("next");
      prevUrl = res.headers.get("prev");

      document.getElementById("nextBtn").disabled = !nextUrl;
      document.getElementById("prevBtn").disabled = !prevUrl;

      const header = document.getElementById("questionHeader");
      header.textContent = data.length > 0 ? data[0].question : "Question details";

      const list = document.getElementById("answersList");
      list.innerHTML = "";

      data.forEach(ans => {
        const div = document.createElement("div");
        div.className = "answer";
        div.innerHTML = `
          <p>${ans.answer}</p>
          <div class="like-box">
            <button class="like" onclick="likeAnswer(${ans.id})"><i class="fas fa-thumbs-up"></i> ${ans.no_of_likes}</button>
            <button class="dislike" onclick="dislikeAnswer(${ans.id})"><i class="fas fa-thumbs-down"></i> ${ans.no_of_dislikes}</button>
          </div>
        `;
        list.appendChild(div);
      });
    }

    async function postAnswer() {
      const text = document.getElementById("answerText").value.trim();
      if (!text) return;

      await fetch(`${apiBase}/question/${questionId}/answers/`, {
        method: "POST",
        headers: getAuthHeaders(),
        body: JSON.stringify({ answer: text })
      });

      document.getElementById("answerText").value = "";
      loadAnswers();
    }

    async function likeAnswer(answerId) {
      await fetch(`${apiBase}/answers/${answerId}/likes/`, {
        method: "POST",
        headers: getAuthHeaders(),
        body: JSON.stringify({ has_liked: true })
      });
      loadAnswers();
    }

    async function dislikeAnswer(answerId) {
      await fetch(`${apiBase}/answers/${answerId}/likes/`, {
        method: "POST",
        headers: getAuthHeaders(),
        body: JSON.stringify({ has_disliked: true })
      });
      loadAnswers();
    }

    loadAnswers();
  </script>
</body>
</html>
