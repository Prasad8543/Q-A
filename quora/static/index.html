<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body, html {
      height: 100%;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #f3f4f6;
    }

    nav {
      background-color: #3b82f6;
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: white;
    }

    nav h1 {
      margin: 0;
      font-size: 1.5rem;
    }

    .nav-links a {
      color: white;
      text-decoration: none;
      margin-left: 1.5rem;
      font-weight: 500;
    }

    .nav-links a:hover {
      text-decoration: underline;
    }

    .center-wrapper {
      display: flex;
      justify-content: center;
      align-items: center;
      height: calc(100vh - 72px); /* navbar height */
      padding: 1rem;
    }

    .container {
      background: white;
      padding: 2rem 2.5rem;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
      width: 100%;
      max-width: 400px;
    }

    .container h2 {
      text-align: center;
      margin-bottom: 1.5rem;
      color: #333;
    }

    .form-group {
      margin-bottom: 1rem;
    }

    label {
      display: block;
      margin-bottom: 0.5rem;
      font-weight: 600;
      color: #333;
    }

    input {
      width: 100%;
      padding: 0.6rem;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 1rem;
    }

    input:focus {
      border-color: #3b82f6;
      outline: none;
    }

    button {
      width: 100%;
      padding: 0.75rem;
      font-size: 1rem;
      background-color: #3b82f6;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 1rem;
    }

    button:hover {
      background-color: #2563eb;
    }

    .redirect-link {
      text-align: center;
      margin-top: 1rem;
    }

    .redirect-link a {
      color: #3b82f6;
      text-decoration: none;
    }

    .redirect-link a:hover {
      text-decoration: underline;
    }

    .error-message {
      color: red;
      font-size: 0.875rem;
      margin-top: 0.5rem;
    }

    .success-message {
      color: green;
      margin-top: 1rem;
      text-align: center;
    }
  </style>
</head>
<body>
  <nav>
    <h1>Q&A</h1>
    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="#">About</a>
      <a href="#">Contact Us</a>
    </div>
  </nav>

  <main class="center-wrapper">
    <div class="container">
      <h2>Login</h2>
      <form id="login-form" onsubmit="loginUser(event)">
        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" id="username" required />
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" required />
        </div>
        <button type="submit">Login</button>
        <div id="login-message" class="error-message"></div>
        <div class="redirect-link">
          Don't have an account? <a href="signup.html">Sign Up</a>
        </div>
      </form>
    </div>
  </main>

  <script>
    async function loginUser(event) {
      event.preventDefault();
      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value.trim();
      const messageBox = document.getElementById("login-message");

      messageBox.innerText = "";

      try {
        const response = await fetch("http://localhost:8000/api/v1/login/", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username, password }),
        });

        const data = await response.json();

        if (response.ok) {
          messageBox.className = "success-message";
          messageBox.innerText = "Login successful! Redirecting...";

          localStorage.setItem("access_token", data.token);

          setTimeout(() => {
            window.location.href = "questions.html";
          }, 1000);
        } else {
          messageBox.className = "error-message";
          messageBox.innerText = data.detail || "Invalid credentials.";
        }
      } catch (error) {
        messageBox.className = "error-message";
        messageBox.innerText = "Something went wrong.";
      }
    }
  </script>
</body>
</html>
